<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Pop - Shoot & Score!</title>
    <meta name="description" content="Pop as many balloons as you can before time runs out!">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="stylesheet" href="main.css" type="text/css">
    <link href='https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap' rel='stylesheet'>
  </head>
  <body>

    <div class="welcome-overlay">
      <div class="welcome-card">
        <h1>Balloon Pop</h1>
        <p>Shoot as many balloons as you can with your shotgun! Use your crosshair to aim.</p>
        <button id="start-game-btn">Start Game</button>
      </div>
    </div>

    <div class="settings-container">
      <button class="settings-btn" aria-label="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="settings-menu">
        <button id="pause-btn">Pause</button>
        <button id="bgm-toggle-btn">Music: ON</button>
        <button id="sfx-toggle-btn">SFX: ON</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <div class="counter">0</div>

    <div class="score-box">
      <div class="badge">
        <span class="label">Game Over</span>
        <p class="quote-text"></p>
        <a href="#" class="replay">Play Again</a>
      </div>
    </div>

    <div class="pause-overlay">
      <div class="pause-card">
        <h2>Game Paused</h2>
        <button id="resume-overlay-btn">Resume Game</button>
      </div>
    </div>

    <div class="balloon">
      <div class="inflatable">
        <svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
            </linearGradient>
            <radialGradient id="shine" cx="30%" cy="30%" r="50%">
              <stop offset="0%" style="stop-color:#fff;stop-opacity:0.6" />
              <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="55" rx="35" ry="45" fill="url(#balloonGrad)" stroke="#8b2e4d" stroke-width="1.5"/>
          <ellipse cx="38" cy="45" rx="12" ry="15" fill="url(#shine)" opacity="0.7"/>
          <path d="M 50 100 Q 48 105 50 110" stroke="#c44569" stroke-width="2" fill="none"/>
          <circle cx="50" cy="110" r="2" fill="#8b2e4d"/>
          <path d="M 45 52 Q 43 48 45 45 Q 47 48 45 52" fill="#8b2e4d" opacity="0.3"/>
          <path d="M 55 58 Q 57 55 59 56 Q 57 58 55 58" fill="#8b2e4d" opacity="0.3"/>
          <ellipse cx="46" cy="50" rx="2" ry="3" fill="#fff" opacity="0.8"/>
          <ellipse cx="54" cy="52" rx="1.5" ry="2" fill="#fff" opacity="0.8"/>
        </svg>
      </div>
      <div class="string"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
